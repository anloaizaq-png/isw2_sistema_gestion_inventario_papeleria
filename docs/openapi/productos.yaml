openapi: 3.0.3

info:
  title: Cotton Cloud Paper - Microservicio de Productos
  version: 1.1.0
  description: |
    Catálogo de artículos de la papelería. Es la fuente de verdad sobre qué
    productos existen, sus categorías y sus datos básicos.

    No administra existencias (Inventario) ni proveedores como entidad
    propia (Proveedores y Compras). `proveedor_id` es solo una referencia
    lógica, sin llave foránea entre bases de datos.

    Todas las rutas de negocio viven bajo `/api/productos`, el mismo prefijo
    que usa el API Gateway, que reenvía la ruta completa sin modificarla.
    El Gateway valida el JWT antes de reenviar la solicitud.

    Las rutas `/health` son operativas y se restringen a la red del clúster.

servers:
  - url: http://localhost:5001
    description: Desarrollo local (el contenedor escucha en 8080 y se publica en 5001)
  - url: http://productos-service:8080
    description: Dirección interna en Docker Compose y Kubernetes

security:
  - bearerAuth: []

tags:
  - name: Productos
    description: Catálogo de productos, consulta, búsqueda y baja lógica.
  - name: Categorias
    description: Categorías y subcategorías (máximo dos niveles).
  - name: Infraestructura
    description: Comprobaciones de disponibilidad.

paths:
  /api/productos:
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Crear un producto
      description: |
        Crea el producto en estado `activo`. El `codigo` debe ser único.
        Si se envía `categoria_id`, la categoría debe existir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoEntrada'
      responses:
        '201':
          description: Producto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    get:
      tags: [Productos]
      operationId: listarProductos
      summary: Listar productos (paginado)
      parameters:
        - name: categoria_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: proveedor_id
          in: query
          required: false
          description: Filtra por el proveedor principal registrado en el producto.
          schema:
            type: integer
            minimum: 1
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [activo, inactivo]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductosPage'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/productos/buscar:
    get:
      tags: [Productos]
      operationId: buscarProductos
      summary: Buscar y filtrar productos (RF12)
      description: |
        Todos los filtros son opcionales y se combinan con AND. `codigo`,
        `codigo_barras`, `nombre`, `categoria` y `marca` aceptan coincidencia
        parcial sin distinguir mayúsculas. `categoria` compara contra el nombre
        de la categoría del producto. `proveedor` es el identificador del
        proveedor principal del producto.
      parameters:
        - name: codigo
          in: query
          required: false
          schema:
            type: string
        - name: codigo_barras
          in: query
          required: false
          schema:
            type: string
        - name: nombre
          in: query
          required: false
          schema:
            type: string
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: marca
          in: query
          required: false
          schema:
            type: string
        - name: proveedor
          in: query
          required: false
          description: Identificador del proveedor principal.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Productos que cumplen todos los filtros enviados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/productos/categorias:
    get:
      tags: [Categorias]
      operationId: listarCategorias
      summary: Listar categorías y subcategorías
      description: Lista plana. Las subcategorías traen su `categoria_padre_id`.
      responses:
        '200':
          description: Todas las categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      tags: [Categorias]
      operationId: crearCategoria
      summary: Crear categoría o subcategoría
      description: |
        Si se envía `categoria_padre_id`, la categoría padre debe existir y ser
        una categoría raíz (no puede ser a su vez una subcategoría). El nombre
        no puede repetirse entre categorías con el mismo padre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaEntrada'
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/productos/categorias/{categoria_id}:
    parameters:
      - $ref: '#/components/parameters/CategoriaId'
    get:
      tags: [Categorias]
      operationId: consultarCategoria
      summary: Consultar una categoría
      responses:
        '200':
          description: Categoría encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    put:
      tags: [Categorias]
      operationId: actualizarCategoria
      summary: Actualizar una categoría
      description: |
        Una categoría no puede ser su propio padre. Una categoría que tiene
        subcategorías no puede convertirse en subcategoría.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaEntrada'
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    delete:
      tags: [Categorias]
      operationId: eliminarCategoria
      summary: Eliminar una categoría
      description: |
        Eliminación física. Responde 409 si la categoría tiene productos
        asociados o subcategorías.
      responses:
        '204':
          description: Categoría eliminada. Sin cuerpo de respuesta.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/productos/{producto_id}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Productos]
      operationId: consultarProducto
      summary: Consultar un producto por id
      description: |
        Devuelve también los productos inactivos. Los demás servicios usan el
        campo `estado` para validar que el producto esté activo.
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    put:
      tags: [Productos]
      operationId: reemplazarProducto
      summary: Actualizar un producto completo
      description: |
        Reemplaza todos los datos editables. No modifica el `estado`; para
        reactivar un producto se usa PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoEntrada'
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    patch:
      tags: [Productos]
      operationId: actualizarProductoParcial
      summary: Actualizar un producto parcialmente
      description: |
        Solo se modifican los campos enviados. Requiere al menos uno. Permite
        cambiar `estado` para reactivar un producto dado de baja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoActualizacion'
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    delete:
      tags: [Productos]
      operationId: darDeBajaProducto
      summary: Dar de baja un producto (baja lógica)
      description: |
        Cambia el estado a `inactivo` sin eliminar el registro. Es idempotente:
        si el producto ya estaba inactivo, responde 200 con su estado actual.
      responses:
        '200':
          description: Producto dado de baja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /health/live:
    get:
      tags: [Infraestructura]
      operationId: comprobarProceso
      summary: Comprobar que el proceso está activo
      description: Restringido a la red del clúster. No consulta la base de datos.
      security: []
      responses:
        '200':
          description: Proceso activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaludResponse'
              example:
                estado: ok
  /health/ready:
    get:
      tags: [Infraestructura]
      operationId: comprobarDisponibilidad
      summary: Comprobar disponibilidad para atender solicitudes
      description: Restringido a la red del clúster. Comprueba la conexión a la base de datos de productos.
      security: []
      responses:
        '200':
          description: Servicio y base de datos disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaludResponse'
              example:
                estado: ok
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaludResponse'
              example:
                estado: no_disponible

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token emitido por el módulo Usuarios. El API Gateway lo valida
        antes de reenviar la solicitud a este servicio.

  parameters:
    ProductoId:
      name: producto_id
      in: path
      required: true
      description: Identificador del producto.
      schema:
        type: integer
        minimum: 1
    CategoriaId:
      name: categoria_id
      in: path
      required: true
      description: Identificador de la categoría.
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: Número de página, comenzando en uno.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de productos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    ProductoEntrada:
      type: object
      required: [codigo, nombre, precio_venta]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          description: Código único del producto.
          example: PAP-001
        codigo_barras:
          type: string
          maxLength: 50
          nullable: true
          example: '7701234567890'
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Cuaderno 100 hojas
        descripcion:
          type: string
          nullable: true
        categoria_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK real a categoría (misma base de datos).
          example: 1
        unidad_medida:
          type: string
          maxLength: 30
          nullable: true
          example: unidad
        marca:
          type: string
          maxLength: 100
          nullable: true
          example: Norma
        precio_venta:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          example: 4500
        proveedor_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Proveedor principal. Referencia lógica al microservicio Proveedores
            y Compras; no es llave foránea física.
          example: 7

    ProductoActualizacion:
      type: object
      minProperties: 1
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
        codigo_barras:
          type: string
          maxLength: 50
          nullable: true
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        descripcion:
          type: string
          nullable: true
        categoria_id:
          type: integer
          minimum: 1
          nullable: true
        unidad_medida:
          type: string
          maxLength: 30
          nullable: true
        marca:
          type: string
          maxLength: 100
          nullable: true
        precio_venta:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        proveedor_id:
          type: integer
          minimum: 1
          nullable: true
        estado:
          type: string
          enum: [activo, inactivo]

    Producto:
      allOf:
        - type: object
          required: [id, estado, fecha_creacion, fecha_actualizacion]
          properties:
            id:
              type: integer
              example: 101
            estado:
              type: string
              enum: [activo, inactivo]
            fecha_creacion:
              type: string
              format: date-time
            fecha_actualizacion:
              type: string
              format: date-time
        - $ref: '#/components/schemas/ProductoEntrada'

    ProductosPage:
      type: object
      required: [page, limit, total, data]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          description: Total de productos que cumplen los filtros.
          example: 135
        data:
          type: array
          items:
            $ref: '#/components/schemas/Producto'

    CategoriaEntrada:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: Útiles escolares
        categoria_padre_id:
          type: integer
          minimum: 1
          nullable: true
          description: Categoría padre cuando se trata de una subcategoría.

    Categoria:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 3
        - $ref: '#/components/schemas/CategoriaEntrada'

    SaludResponse:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [ok, no_disponible]

    ErrorResponse:
      type: object
      required: [codigo, mensaje, requestId]
      properties:
        codigo:
          type: string
          example: DATOS_INVALIDOS
        mensaje:
          type: string
          example: La solicitud contiene datos inválidos.
        requestId:
          type: string
          description: Identificador de trazabilidad de la solicitud.
          example: req-000125

  responses:
    DatosInvalidos:
      description: Datos de entrada inválidos o regla de validación incumplida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: DATOS_INVALIDOS
            mensaje: El campo precio_venta debe ser mayor o igual a 0.
            requestId: req-000125
    NoAutenticado:
      description: Token ausente o sesión inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Las credenciales o la sesión no son válidas.
            requestId: req-000125
    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: RECURSO_NO_ENCONTRADO
            mensaje: El recurso solicitado no existe.
            requestId: req-000125
    Conflicto:
      description: Conflicto con un registro existente o con una regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: CODIGO_DUPLICADO
            mensaje: Ya existe un producto con el código indicado.
            requestId: req-000125
    ServicioNoDisponible:
      description: La base de datos no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: SERVICIO_NO_DISPONIBLE
            mensaje: El servicio no está disponible temporalmente.
            requestId: req-000125
